name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: KeyKhan
          path: |
            artifacts/installer/KeyKhan-Setup.exe
            artifacts/publish/KeyKhan.exe
