name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v')

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/publish/KeyKhan.exe install.ps1 --title "KeyKhan $env:GITHUB_REF_NAME" --generate-notes
