name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Installer -Version ($env:GITHUB_REF_NAME -replace '^v')

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          artifacts/installer/KeyKhan-Setup.exe artifacts/publish/KeyKhan.exe
          --title "KeyKhan $env:GITHUB_REF_NAME" --generate-notes
