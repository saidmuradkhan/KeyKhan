name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Installer -Version ($env:GITHUB_REF_NAME -replace '^v')

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # KeyKhan 1.2 and earlier look for KeyKhan-Setup.exe; the copy lets them update to PassIn in one click.
        run: |
          Copy-Item artifacts/installer/PassIn-Setup.exe artifacts/installer/KeyKhan-Setup.exe
          gh release create $env:GITHUB_REF_NAME `
            artifacts/installer/PassIn-Setup.exe artifacts/publish/PassIn.exe artifacts/installer/KeyKhan-Setup.exe `
            --title "PassIn $env:GITHUB_REF_NAME" --generate-notes
