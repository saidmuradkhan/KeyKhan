ShortDescription: A fast, offline password manager with a global quick-access hotkey.
Description: |-
  KeyKhan keeps your passwords in a single encrypted file on your PC. Press Win + ~ anywhere, type a few letters and
  press Enter to copy a password, or let it auto-type the login. It includes a 2FA code generator, a password generator,
  folders, a recovery key and automatic updates. Encryption is AES-256-GCM from Windows CNG.
